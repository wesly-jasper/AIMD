[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = -v --tb=short
markers =
    slow: slow running tests
    real_auth: exercise the real authentication dependency instead of the
        conftest override. Required for any test that asserts how the API
        behaves for an anonymous or wrongly-roled caller.
    rate_limited: run with the rate limiter enabled (it is disabled for every
        other test, since all TestClient requests share one client address).
    live: calls a real external model API; skipped unless its credential is
        exported (NEBIUS_API_KEY in the shell that runs pytest).
